# 聚芯节点独立后台：jd.ldjuxin.yun
#
# 将此文件安装到服务器的 Nginx sites-available 后启用。
# 原 NVIDIA/Orin 站点配置不要覆盖；若同一域名已有旧站点，请先备份并停用旧的
# jd.ldjuxin.yun server block，确保同一 listen/server_name 只有这一份生效配置。

server {
    listen 80;
    listen [::]:80;
    server_name jd.ldjuxin.yun;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jd.ldjuxin.yun;

    ssl_certificate /etc/letsencrypt/live/jd.ldjuxin.yun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jd.ldjuxin.yun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 500m;

    # WebSocket 终端需要 HTTP/1.1 Upgrade。
    location /ws/ {
        proxy_pass http://127.0.0.1:18175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # APP 客户端接口进入独立的 APP 后端容器。
    # 必须放在通用 location / 之前，避免被二开后台接收后返回 404。
    location ^~ /api/app/ {
        proxy_pass http://127.0.0.1:18091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # APP 更新清单和 APK 下载由 APP 后端提供。
    location ^~ /api/mobile-app/ {
        proxy_pass http://127.0.0.1:18091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ^~ /api/admin/app-updates {
        proxy_pass http://127.0.0.1:18091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 登录态及用户信息由 APP 后端负责校验。
    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:18091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # RK3588 Agent 的入网、心跳和任务接口由二开后台处理。
    # 该后台通过 juxin-node-admin (18175) 转发到 juxin-node-backend
    # (8090)，设备状态和令牌统一写入二开库。
    location ^~ /api/edge/ {
        proxy_pass http://127.0.0.1:18175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 页面、REST API 和上传全部进入独立 juxin-node 容器。
    location / {
        proxy_pass http://127.0.0.1:18175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
