# 聚芯节点独立后台：jd.ldjuxin.yun
#
# 将此文件安装到服务器的 Nginx sites-available 后启用。
# 原 NVIDIA/Orin 站点配置不要覆盖；若同一域名已有旧站点，请先备份并停用旧的
# jd.ldjuxin.yun server block，确保同一 listen/server_name 只有这一份生效配置。

server {
    listen 80;
    listen [::]:80;
    server_name jd.ldjuxin.yun;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jd.ldjuxin.yun;

    ssl_certificate /etc/letsencrypt/live/jd.ldjuxin.yun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jd.ldjuxin.yun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 500m;

    # WebSocket 终端需要 HTTP/1.1 Upgrade。
    location /ws/ {
        proxy_pass http://127.0.0.1:18175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 页面、REST API 和上传全部进入独立 juxin-node 容器。
    location / {
        proxy_pass http://127.0.0.1:18175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
