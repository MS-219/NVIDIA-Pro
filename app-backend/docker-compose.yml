services:
  mysql:
    image: mysql:8.4
    container_name: juxin-orin-app-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: orin_app
      MYSQL_USER: ${APP_DB_USERNAME:-orin_app}
      MYSQL_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${APP_MYSQL_ROOT_PASSWORD:?set APP_MYSQL_ROOT_PASSWORD}
    volumes:
      - app_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --silent -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build: .
    container_name: juxin-orin-app-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_SERVER_PORT: 8091
      APP_DB_URL: jdbc:mysql://mysql:3306/orin_app?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      APP_DB_USERNAME: ${APP_DB_USERNAME:-orin_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:8091}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET}
      APP_SMS_PROVIDER: ${APP_SMS_PROVIDER:-mock}
      APP_SMS_PEPPER: ${APP_SMS_PEPPER:?set APP_SMS_PEPPER}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${ALIBABA_CLOUD_ACCESS_KEY_ID:-}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}
      ALI_SMS_SIGN_NAME: ${ALI_SMS_SIGN_NAME:-}
      ALI_SMS_TEMPLATE_CODE: ${ALI_SMS_TEMPLATE_CODE:-}
      ALI_SMS_CONNECT_TIMEOUT_MILLIS: ${ALI_SMS_CONNECT_TIMEOUT_MILLIS:-5000}
      ALI_SMS_READ_TIMEOUT_MILLIS: ${ALI_SMS_READ_TIMEOUT_MILLIS:-10000}
    ports:
      - "${APP_BACKEND_PORT:-18091}:8091"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8091/api/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

volumes:
  app_mysql_data:
