server:
  port: ${APP_SERVER_PORT:8091}

spring:
  datasource:
    url: ${APP_DB_URL:jdbc:h2:file:./data/orin_app;MODE=MySQL;AUTO_SERVER=TRUE}
    username: ${APP_DB_USERNAME:sa}
    password: ${APP_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://127.0.0.1:8091}
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8088,http://127.0.0.1:8088}
  jwt-secret: ${APP_JWT_SECRET:local-only-jwt-secret-change-before-production-0123456789}
  sms:
    provider: mock
    pepper: ${APP_SMS_PEPPER:local-only-sms-pepper-change-before-production}
