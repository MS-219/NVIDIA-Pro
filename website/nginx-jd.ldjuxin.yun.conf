server {
    listen 80;
    listen [::]:80;
    server_name jd.ldjuxin.yun;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jd.ldjuxin.yun;

    ssl_certificate /etc/letsencrypt/live/jd.ldjuxin.yun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jd.ldjuxin.yun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/juxin-node-site;
    index console.html;

    location /api/ {
        proxy_pass http://127.0.0.1:18091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Keep a missing APK from falling back to the website index page.
    location = /downloads/juxin-node-latest.apk {
        try_files $uri =404;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="juxin-node-latest.apk"' always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = / {
        try_files /console.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
