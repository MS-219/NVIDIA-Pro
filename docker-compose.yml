services:
  mysql:
    image: mysql:8.4
    container_name: juxin-orin-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: juxin_orin
      MYSQL_USER: ${ORIN_DB_USERNAME:-juxin_orin}
      MYSQL_PASSWORD: ${ORIN_DB_PASSWORD:?set ORIN_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${ORIN_MYSQL_ROOT_PASSWORD:?set ORIN_MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - orin_mysql_data:/var/lib/mysql
      - ./deploy/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --silent -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - orin_internal

  backend:
    build:
      context: ./backend
    image: juxin-orin-backend:${IMAGE_TAG:-latest}
    container_name: juxin-orin-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      ORIN_SERVER_PORT: 8090
      ORIN_DB_URL: ${ORIN_DB_URL:-jdbc:mysql://mysql:3306/juxin_orin?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
      ORIN_DB_USERNAME: ${ORIN_DB_USERNAME:-juxin_orin}
      ORIN_DB_PASSWORD: ${ORIN_DB_PASSWORD}
      ORIN_JWT_SECRET: ${ORIN_JWT_SECRET:?set ORIN_JWT_SECRET in .env}
      ORIN_ADMIN_USERNAME: ${ORIN_ADMIN_USERNAME:-admin}
      ORIN_ADMIN_PASSWORD: ${ORIN_ADMIN_PASSWORD:?set ORIN_ADMIN_PASSWORD in .env}
      ORIN_PUBLIC_BASE_URL: ${ORIN_PUBLIC_BASE_URL}
      ORIN_CORS_ALLOWED_ORIGINS: ${ORIN_CORS_ALLOWED_ORIGINS:-http://localhost:5174}
      ORIN_WECHAT_APP_ID: ${ORIN_WECHAT_APP_ID:-}
      ORIN_WECHAT_APP_SECRET: ${ORIN_WECHAT_APP_SECRET:-}
      ORIN_BOSSKG_ENABLED: ${ORIN_BOSSKG_ENABLED:-false}
      ORIN_BOSSKG_API_URL: ${ORIN_BOSSKG_API_URL:-https://api.example.invalid}
      ORIN_BOSSKG_MER_ID: ${ORIN_BOSSKG_MER_ID:-}
      ORIN_BOSSKG_PROVIDER_ID: ${ORIN_BOSSKG_PROVIDER_ID:-}
      ORIN_BOSSKG_TASK_ID: ${ORIN_BOSSKG_TASK_ID:-}
      ORIN_BOSSKG_DES_KEY: ${ORIN_BOSSKG_DES_KEY:-}
      ORIN_BOSSKG_PRIVATE_KEY: ${ORIN_BOSSKG_PRIVATE_KEY:-}
      ORIN_BOSSKG_PUBLIC_KEY: ${ORIN_BOSSKG_PUBLIC_KEY:-}
      ORIN_BOSSKG_CONTRACT_NOTIFY_URL: ${ORIN_BOSSKG_CONTRACT_NOTIFY_URL:-https://orin-api.example.invalid/api/bosskg/notify/contract}
      ORIN_BOSSKG_PAYMENT_NOTIFY_URL: ${ORIN_BOSSKG_PAYMENT_NOTIFY_URL:-https://orin-api.example.invalid/api/bosskg/notify/payment}
      ORIN_AGENT_ASSET_PATH: /agent-assets
      ORIN_PLATFORM_VERSION: ${IMAGE_TAG:-latest}
    ports:
      - "8090:8090"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./image/agent:/agent-assets:ro
    networks:
      - orin_internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    image: juxin-orin-admin:${IMAGE_TAG:-latest}
    container_name: juxin-orin-admin
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8174:80"
    networks:
      - orin_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  orin_mysql_data:
    name: juxin-orin-mysql-data

networks:
  orin_internal:
    name: juxin-orin-internal
